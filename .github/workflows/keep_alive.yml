name: Keep Streamlit App Alive - Every 3 Hours

on:
  schedule:
    # Run every 3 hours (more frequent) to prevent sleep
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        attempt: [1, 2, 3]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ping Streamlit App (Attempt ${{ matrix.attempt }}/3)
        id: ping
        continue-on-error: true
        run: |
          echo "🚀 Keep-Alive Check - Attempt ${{ matrix.attempt }}/3"
          echo "⏰ Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
          STREAMLIT_URL="https://maize-quantum-app-6jmirwun4wa2aokjqnshgh.streamlit.app/"
          
          # Aggressive curl with multiple strategies
          HTTP_CODE=$(curl \
            -X GET \
            --silent \
            --show-error \
            --max-time 45 \
            --connect-timeout 15 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --compressed \
            --write-out "%{http_code}" \
            --output /tmp/response_${{ matrix.attempt }}.html \
            "$STREAMLIT_URL" 2>&1 || echo "000")
          
          echo "📊 HTTP Status Code: $HTTP_CODE"
          
          # Accept any response that indicates app is awake (not 000 or timeouts)
          if [ "$HTTP_CODE" != "000" ] && [ -n "$HTTP_CODE" ]; then
            echo "✅ App Response Received (Status: $HTTP_CODE)"
            echo "status=success" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "⚠️  Attempt ${{ matrix.attempt }} - No response yet"
            exit 1
          fi

      - name: Wait between attempts
        if: failure() && matrix.attempt < 3
        run: sleep 30

      - name: Log Results
        if: always()
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║   STREAMLIT APP KEEP-ALIVE MONITOR    ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "🕐 Current Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🌐 App URL: https://maize-quantum-app-6jmirwun4wa2aokjqnshgh.streamlit.app/"
          echo "📡 Attempt: ${{ matrix.attempt }}/3"
          echo "✅ Status: $([ ${{ steps.ping.outcome }} = 'success' ] && echo 'AWAKE' || echo 'CHECKING')"
          echo "⏱️  Schedule: Every 3 hours"
          echo ""
          echo "📋 Next scheduled check in 3 hours"

      - name: Final Summary
        if: always()
        run: |
          {
            echo "## 🌽 Maize App Keep-Alive Report"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Status | $([ ${{ steps.ping.outcome }} = 'success' ] && echo '✅ Awake' || echo '🔄 Checking') |"
            echo "| Time | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
            echo "| Frequency | Every 3 hours |"
            echo "| Next Run | Automatic |"
            echo ""
            echo "**App URL:** https://maize-quantum-app-6jmirwun4wa2aokjqnshgh.streamlit.app/"
          } >> $GITHUB_STEP_SUMMARY
