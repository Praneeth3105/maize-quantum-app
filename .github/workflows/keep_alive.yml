name: Keep Streamlit Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping using wget
        run: |
          wget \
            --quiet \
            --tries=1 \
            --timeout=60 \
            --user-agent="Mozilla/5.0" \
            -O /dev/null \
            "https://maize-quantum-app-6jmirwun4wa2aokjqnshgh.streamlit.app/" || true
