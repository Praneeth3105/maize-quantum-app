name: Ping Streamlit App

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit App
        run: |
          curl --silent --show-error --location \
          --user-agent "Mozilla/5.0" \
          https://maize-quantum-app-6jmirwun4wa2aokjqnshgh.streamlit.app/ > /dev/null
