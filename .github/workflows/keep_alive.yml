name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Streamlit App
        run: |
          curl \
            -A "Mozilla/5.0" \
            --max-redirs 10 \
            --connect-timeout 10 \
            --max-time 30 \
            -L \
            "https://maize-quantum-app-6jmirwun4wa2aokjqnshgh.streamlit.app/"
