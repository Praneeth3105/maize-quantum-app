name: Keep Streamlit Alive

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for DNS
        run: sleep 10

      - name: Ping Streamlit App
        run: |
          curl --silent \
               --show-error \
               --location \
               --max-redirs 5 \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               --connect-timeout 30 \
               --max-time 60 \
               "https://maize-quantum-app-6jmirwun4wa2aokjqnshgh.streamlit.app/" \
               -o /dev/null

      - name: Done
        run: echo "Ping completed."
