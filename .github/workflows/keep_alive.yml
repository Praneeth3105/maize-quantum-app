name: Ping Streamlit App
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl --fail --silent --show-error --location \
            --max-time 60 \
            --user-agent "Mozilla/5.0" \
            https://maize-quantum-app-6jmirwun4wa2aokjqnshgh.streamlit.app/ \
            -o /dev/null -w "HTTP Status: %{http_code}\n"
